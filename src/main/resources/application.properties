spring.application.name=Siparis_yonetim_sistemi

# --- H2 (bellek ici veritabani) ---
# mem:siparisdb -> disk yok, uygulama kapaninca veri de gider.
spring.datasource.url=jdbc:h2:mem:siparisdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# update: entity'lerine bakip tablolari otomatik olusturur/gunceller.
spring.jpa.hibernate.ddl-auto=update
# ASLA KAPATMA: Hibernate'in arkada attigi SQL'i konsolda gorursun.
# Asama 4'te N+1'i tam olarak buradan yakalayacaksin.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- H2 Console ---
# Tarayicidan http://localhost:8080/h2-console -> JDBC URL alanina jdbc:h2:mem:siparisdb yaz.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
